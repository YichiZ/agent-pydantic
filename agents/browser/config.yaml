# The models the browser agent can run on. `model` is the full Pydantic AI model string; `name` is the agent's
# name in traces. Chat uses `default`; the eval picks an entry with --model.
default: sonnet-5.5

models:
  sonnet-5.5:
    model: anthropic:claude-sonnet-5-5
    name: browser-agent-sonnet
  6.1-terra:
    # openai:, not openai-chat:. Chat Completions rejects tools while reasoning is on for this model.
    model: openai:gpt-6.1-terra
    name: browser-agent-terra
  6.1-terra-codex:
    # Codex/ChatGPT subscription, not the API key: reads the Codex CLI login at ~/.codex/auth.json (read-only).
    model: openai-codex:gpt-6.1-terra
    name: browser-agent-terra-codex
  6-luna-codex:
    # Codex/ChatGPT subscription, not the API key: reads the Codex CLI login at ~/.codex/auth.json (read-only).
    model: openai-codex:gpt-6-luna
    name: browser-agent-luna-codex
