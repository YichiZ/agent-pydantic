[project]
name = "agent-pydantic"
version = "0.1.0"
description = "Independent AI agents built with Pydantic AI, one package each under agents/"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=2.71.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
browser = [
    "pydantic-ai-harness[playwright]>=0.75.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.uv]
default-groups = ["dev", "browser"]  # `uv sync --no-group browser` skips Playwright

[tool.pytest.ini_options]
testpaths = ["agents"]
pythonpath = ["."]
addopts = "-m 'not e2e'"  # stay offline by default; `uv run pytest -m e2e` runs the live tests
markers = ["e2e: live runs against the real model; need ANTHROPIC_API_KEY"]
