[project]
name = "agent-pydantic"
version = "0.1.0"
description = "AI coworker for accounts receivable, built with Pydantic AI"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai>=2.71.0",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
